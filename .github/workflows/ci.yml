name: ci-the-app
on:
  workflow_dispatch:

jobs:
  job-ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-the-repo
        uses: actions/checkout@v6-beta
        
      - name: build-the-app
        run: |
           mvn -version
           mvn clean package -DskipTests
           
      - name: test-the-app
        run: mvn test
        
  
